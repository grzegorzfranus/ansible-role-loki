---
# =============================================================================
# Ansible Role: Loki - Tasks: Docker Deployment Setup
# =============================================================================
# Ensures Docker Engine prerequisite role is included and pulls pinned container image.
# =============================================================================

- name: Loki | install_docker | Ensure Docker Engine is installed and configured
  ansible.builtin.include_role:
    name: grzegorzfranus.docker
  when:
    - loki_deployment_method | lower == 'docker'
    - loki_manage_service_restart | bool

- name: Loki | install_docker | Pull Grafana Loki container image
  community.docker.docker_image_pull:
    name: "{{ loki_image }}:{{ loki_image_tag }}"
  register: __loki_docker_pull
  retries: 3
  delay: 5
  until: __loki_docker_pull is succeeded
  when:
    - loki_deployment_method | lower == 'docker'
    - loki_manage_service_restart | bool
