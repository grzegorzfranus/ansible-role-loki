# =============================================================================
# Ansible Role: Loki - Molecule Preparation Playbook (default)
# =============================================================================

---
- name: Loki | molecule | default | Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Loki | molecule | prepare | Disable EPEL repository (RedHat)
      ansible.builtin.shell: |
        if [ -f /etc/yum.repos.d/epel.repo ]; then
          sed -i 's/enabled=1/enabled=0/g' /etc/yum.repos.d/epel*.repo || true
        fi
      failed_when: false
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Loki | molecule | prepare | Fix PAM sudo configuration for container root
      ansible.builtin.raw: |
        usermod -U root 2>/dev/null || true
        echo "account sufficient pam_permit.so" >> /etc/pam.d/sudo 2>/dev/null || true
      failed_when: false
      changed_when: false
